name: ARANDU A2 — Fundação GNOME (Rust e contratos)
on:
  push:
    branches:
      - a2/gnome-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      - name: Preparar Rust com rustfmt e clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verificar formatação Rust
        run: cargo fmt --all -- --check
      - name: Verificar compilação
        run: cargo check --workspace --locked
      - name: Testar núcleo Rust e adaptadores
        run: cargo test --workspace --locked
      - name: Lints Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Testes Python da ponte GNOME (sintéticos)
        run: python3 -m unittest discover -s tests -p test_gnome_bridge.py -v
